apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaintbox-deployment
  namespace: complaintbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: complaintbox
  template:
    metadata:
      labels:
        app: complaintbox
    spec:
      containers:
        - name: complaintbox
          image: abintony/complaintbox:latest
          ports:
            - containerPort: 8000
